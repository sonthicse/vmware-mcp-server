[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "vmware-mcp-server"
version = "0.1.0"
description = "MCP server for configuring and managing VMware Workstation Pro virtual machines"
readme = "README.md"
requires-python = ">=3.10"
license = { file = "LICENSE" }
keywords = ["mcp", "vmware", "workstation", "virtualization", "claude"]
classifiers = [
    "Environment :: Console",
    "Intended Audience :: System Administrators",
    "Operating System :: Microsoft :: Windows",
    "Programming Language :: Python :: 3",
    "Topic :: System :: Emulators",
]
dependencies = ["fastmcp>=3.0,<4"]

[project.optional-dependencies]
dev = ["pytest>=8", "ruff>=0.6"]

[project.scripts]
vmware-mcp-server = "vmware_mcp.server:main"

[tool.hatch.build.targets.wheel]
packages = ["src/vmware_mcp"]

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]
# E501: long descriptive strings in tool schemas.
# SIM108: the explicit if/else in VmxFile.set reads better than a nested ternary.
ignore = ["E501", "SIM108"]

[tool.pytest.ini_options]
testpaths = ["tests"]
# `evaluation` is on the path so tests/test_evaluation.py can import the shared
# toolset helper the eval runner uses.
pythonpath = ["src", "evaluation"]
